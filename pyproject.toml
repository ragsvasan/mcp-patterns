[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-patterns"
version = "0.1.0"
description = "Production-ready security patterns for MCP (Model Context Protocol) servers — PII scrubbing, field-semantic redaction, and compliance tooling."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "pii", "redaction", "security", "compliance", "gdpr", "hipaa", "soc2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# No runtime dependencies — stdlib only (re, hashlib, logging, dataclasses).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/your-org/mcp-patterns"
Repository = "https://github.com/your-org/mcp-patterns"
Issues = "https://github.com/your-org/mcp-patterns/issues"

[tool.hatch.build.targets.wheel]
packages = ["mcp_patterns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["mcp_patterns"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
